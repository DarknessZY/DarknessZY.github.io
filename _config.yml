# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 耀耀切克闹
subtitle: ''
description: ''
keywords:
author: 耀耀切克闹
language: zh-CN
timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: http://example.com
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: false # ParticleX 使用自带 Highlight.js，必须关闭 Hexo 自带高亮
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 8
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# 归档生成（ParticleX 不支持年度/月度归档，只保留总归档）
archive_generator:
  enabled: true
  per_page: 0
  yearly: false
  monthly: false
  daily: false

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: particlex

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
- type: git
  repo: https://github.com/DarknessZY/DarknessZY.github.io.git
  branch: master
# - type: git
#   repo: root@101.42.41.69:/myPoject-Yao/repo/myBlog.git
#   branch: master
  
# Hexo-generator-search 本地搜索插件
search:
  path: search.xml
  field: post
  format: html

#添加RSS订阅功能
feed:
    type: atom
    path: atom.xml
    limit: 20
    hub:
    content:
    content_limit: 140
    content_limit_delim: ' '
    order_by: -date

# Live2D 看板娘（hexo-helper-live2d 只读取站点根目录配置，写在主题配置里无效）
live2d:
  enable: true
  scriptFrom: local
  pluginRootPath: live2dw/
  pluginJsPath: lib/
  pluginModelPath: assets/
  tagMode: false
  debug: false
  model:
    use: live2d-widget-model-wanko
  display:
    position: right
    width: 150
    height: 300
  mobile:
    show: false
    
# ===== 性能优化说明 =====
# 已移除 hexo-neat / hexo-lazyload / all_minifier 旧配置：
# 1. hexo-neat 会压缩破坏 ParticleX 的 Vue3 打包 JS，且主题静态资源本身已压缩
# 2. hexo-lazyload 会改写 img 标签，与 ParticleX 的图片预览组件冲突
# 3. all_minifier 等插件实际未安装，属于无效配置
# ParticleX 静态资源（Vue/FontAwesome/Highlight.js）走 ZStatic CDN，无需本地压缩
# 如仍需图片懒加载，建议用 ParticleX 自带的 preview 功能或在文中使用 loading="lazy"